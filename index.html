<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <title>O que mais te agrada em jogos?</title>
</head>
<body>
    <div class="caixa-principal">
        <h1>O que mais te agrada em jogos?</h1>
        
        <div class="tela-inicial">
            <p>Descubra o seu perfil de jogador! Responda às perguntas a seguir e veja a análise personalizada do seu estilo nos videogames.</p>
            <button class="iniciar-btn">Iniciar Quiz</button>
        </div>

        <div class="caixa-perguntas"></div>
        <div class="caixa-alternativas"></div>
        
        <div class="caixa-resultado">
            <p class="texto-resultado"></p>
            <button class="novamente-btn">Jogar novamente</button>
        </div>
    </div>  

    <script type="module" src="js/script.js"></script>  
</body>
</html>
